    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c2b"/><stop offset="1" stop-color="#080d16"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#6ef2c0"/><stop offset="1" stop-color="#74aaff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#26364b" stroke-width=".6"/></pattern>
  </defs>
  <rect width="1200" height="440" rx="20" fill="url(#bg)"/>
  <rect x="790" width="410" height="440" fill="url(#grid)" opacity=".6"/>
  <path d="M32 1H1168" stroke="url(#accent)" stroke-width="2"/>

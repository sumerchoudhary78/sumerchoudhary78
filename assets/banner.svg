<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Sumer Jakhar — Software developer</title>
  <desc id="desc">Rust, agents, and systems. Building tools that take control of the machine. A dark terminal-inspired banner with a mint and blue geometric circuit.</desc>

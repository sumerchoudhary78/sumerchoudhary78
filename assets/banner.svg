    <text x="56" y="118" fill="#6ef2c0" font-size="15" letter-spacing="3">RUST / AGENTS / SYSTEMS</text>
    <text x="51" y="204" fill="#f0f6fc" font-size="70" font-weight="700" letter-spacing="-4">Sumer Jakhar<tspan fill="#6ef2c0">.</tspan></text>
    <text x="56" y="257" fill="#c1cfdf" font-size="23">Building tools that take control</text>
    <text x="56" y="291" fill="#c1cfdf" font-size="23">of the machine.</text>
    <rect x="56" y="338" width="371" height="40" rx="7" fill="#132b2b" stroke="#285348"/>
    <text x="74" y="364" fill="#6ef2c0" font-size="14">$ build → inspect → improve → repeat</text>
